services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 8000
      APP_BASE_URL: ${DEV_BACKEND_ORIGIN:-http://localhost:8000}
      FRONTEND_BASE_URL: ${DEV_FRONTEND_ORIGIN:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${DEV_FRONTEND_ORIGIN:-http://localhost:5173}
      DEV_POLLING: ${DEV_POLLING:-false}
    dns:
      - ${DEV_DNS_PRIMARY:-1.1.1.1}
      - ${DEV_DNS_SECONDARY:-8.8.8.8}
    ports:
      - "${DEV_BACKEND_BIND:-127.0.0.1}:${DEV_BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend
      - ./ai-kit:/app/ai-kit
      - backend_node_modules:/app/backend/node_modules
      - ai_kit_node_modules:/app/ai-kit/node_modules
    init: true

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    environment:
      VITE_APP_ENV: development
      VITE_API_BASE_URL: ${DEV_BACKEND_ORIGIN:-http://localhost:8000}/api
      VITE_SOCKET_URL: ${DEV_BACKEND_ORIGIN:-http://localhost:8000}
      DOCKER_DEV_POLLING: ${DEV_POLLING:-false}
    ports:
      - "${DEV_FRONTEND_BIND:-127.0.0.1}:${DEV_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    init: true

volumes:
  backend_node_modules:
  ai_kit_node_modules:
  frontend_node_modules:
