name: jobhub-production

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 8000
      APP_BASE_URL: ${PUBLIC_BACKEND_ORIGIN:-http://localhost:8000}
      FRONTEND_BASE_URL: ${PUBLIC_FRONTEND_ORIGIN:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_FRONTEND_ORIGIN:-http://localhost:8080}
    dns:
      - ${PROD_DNS_PRIMARY:-1.1.1.1}
      - ${PROD_DNS_SECONDARY:-8.8.8.8}
    ports:
      - "${PROD_BACKEND_BIND:-127.0.0.1}:${PROD_BACKEND_PORT:-8000}:8000"
    init: true
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${PUBLIC_BACKEND_ORIGIN:-http://localhost:8000}/api
        VITE_SOCKET_URL: ${PUBLIC_BACKEND_ORIGIN:-http://localhost:8000}
    ports:
      - "${PROD_FRONTEND_BIND:-127.0.0.1}:${PROD_FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
